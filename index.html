<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f6f2" />
  <meta name="description" content="STARPlanner · 一个像聊天一样陪你完成计划的温柔伙伴，每天不定时给你鼓励与催促。" />
  <title>STARPlanner · 陪你完成计划</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌟</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- 左侧边栏：伙伴卡片 + 计划列表 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-mark">🌟</span>
          <span class="brand-name">STARPlanner</span>
        </div>
        <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="收起侧栏" title="收起侧栏">✕</button>
      </div>

      <!-- 伙伴卡片 -->
      <section class="companion-card" id="companionCard">
        <div class="companion-avatar" id="companionAvatar" title="点击设置伙伴">
          <span class="avatar-inner" id="companionAvatarInner">🐻</span>
          <span class="avatar-status"></span>
        </div>
        <div class="companion-meta">
          <div class="companion-name" id="companionName">星野</div>
          <div class="companion-slogan" id="companionSlogan">你的私人计划搭子</div>
        </div>
        <button class="icon-btn" id="openSettings" aria-label="设置伙伴" title="设置伙伴头像与昵称">⚙</button>
      </section>

      <!-- 计划列表 -->
      <section class="plans-section">
        <div class="section-head">
          <h2 class="section-title">我的计划</h2>
          <button class="icon-btn" id="addPlanBtn" aria-label="新建计划" title="新建计划">＋</button>
        </div>
        <div class="plan-list" id="planList"></div>
        <div class="plans-empty" id="plansEmpty">
          <span class="empty-icon">🗒️</span>
          <p>还没有计划，点击 ＋ 添加一个吧</p>
        </div>
      </section>

      <div class="sidebar-foot">
        <span class="foot-tip" id="footTip">今日提醒将在随机时刻送达</span>
      </div>
    </aside>

    <!-- 主聊天区 -->
    <main class="chat">
      <header class="chat-header">
        <button class="icon-btn only-mobile" id="sidebarOpen" aria-label="打开侧栏" title="计划与伙伴">☰</button>
        <div class="chat-header-id">
          <div class="chat-header-avatar" id="headerAvatar">🐻</div>
          <div>
            <div class="chat-header-name" id="headerName">星野</div>
            <div class="chat-header-status" id="headerStatus">在线 · 会不定时来陪你</div>
          </div>
        </div>
        <div class="chat-header-actions">
          <button class="icon-btn" id="notifyBtn" aria-label="开启桌面通知" title="桌面通知">🔔</button>
          <button class="icon-btn" id="themeBtn" aria-label="切换深浅色" title="切换深浅色">🌙</button>
        </div>
      </header>

      <div class="messages" id="messages" aria-live="polite"></div>

      <div class="composer">
        <div class="quick-replies" id="quickReplies"></div>
        <form class="composer-row" id="composerForm">
          <input
            type="text"
            id="messageInput"
            class="composer-input"
            placeholder="和你的伙伴说句话…"
            autocomplete="off"
            maxlength="500"
          />
          <button type="submit" class="send-btn" id="sendBtn" aria-label="发送" title="发送">➤</button>
        </form>
      </div>
    </main>
  </div>

  <!-- 新建计划弹窗 -->
  <div class="overlay" id="planOverlay" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3 id="planModalTitle">新建计划</h3>
        <button class="icon-btn" data-close="planOverlay" aria-label="关闭">✕</button>
      </div>
      <label class="field">
        <span>计划内容</span>
        <input type="text" id="planTitle" placeholder="例如：写完周报、跑步 30 分钟" maxlength="120" />
      </label>
      <label class="field">
        <span>截止时间（可选）</span>
        <input type="datetime-local" id="planDue" />
      </label>
      <label class="field">
        <span>重要程度</span>
        <div class="priority-pick" id="priorityPick">
          <button type="button" data-priority="low" class="priority low">普通</button>
          <button type="button" data-priority="medium" class="priority medium active">重要</button>
          <button type="button" data-priority="high" class="priority high">紧急</button>
        </div>
      </label>
      <div class="modal-actions">
        <button class="btn ghost" data-close="planOverlay">取消</button>
        <button class="btn primary" id="planSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 伙伴设置弹窗 -->
  <div class="overlay" id="settingsOverlay" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3>设置你的伙伴</h3>
        <button class="icon-btn" data-close="settingsOverlay" aria-label="关闭">✕</button>
      </div>

      <div class="field">
        <span>昵称</span>
        <input type="text" id="companionNameInput" placeholder="给 TA 起个名字" maxlength="16" />
      </div>

      <div class="field">
        <span>头像 · 选择一个表情</span>
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>

      <div class="field">
        <span>或上传一张图片</span>
        <div class="upload-row">
          <input type="file" id="avatarUpload" accept="image/*" hidden />
          <button class="btn ghost" id="avatarUploadBtn">选择图片</button>
          <button class="btn ghost danger" id="avatarResetBtn">恢复默认</button>
        </div>
        <p class="hint">图片会保存在本地浏览器，不会上传到服务器。</p>
      </div>

      <div class="field">
        <span>每日鼓励与催促频率</span>
        <div class="priority-pick" id="freqPick">
          <button type="button" data-freq="low" class="priority low">偶尔</button>
          <button type="button" data-freq="medium" class="priority medium active">适中</button>
          <button type="button" data-freq="high" class="priority high">频繁</button>
        </div>
      </div>

      <div class="field">
        <span>活跃时段</span>
        <div class="time-range">
          <input type="time" id="activeStart" />
          <span>至</span>
          <input type="time" id="activeEnd" />
        </div>
        <p class="hint">只在这段时间内随机提醒，避免深夜打扰。</p>
      </div>

      <div class="modal-actions">
        <button class="btn ghost" data-close="settingsOverlay">取消</button>
        <button class="btn primary" id="settingsSave">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
